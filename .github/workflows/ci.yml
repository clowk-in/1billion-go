name: CI

# The tests of the SDK on each pull request and each push to main. When the
# tests pass on a release commit (the commit "release: X.Y.Z" that make tag
# pushes with its tag vX.Y.Z), the last job makes the GitHub release
# (release.yml). So a release is tested once, and a red CI releases nothing.

on:
  pull_request:
  push:
    branches: [main]

# A release commit has a group of its own, so no push cancels it.
concurrency:
  group: "${{ startsWith(github.event.head_commit.message, 'release: ') && format('ci-release-{0}', github.sha) || format('ci-{0}', github.ref) }}"
  cancel-in-progress: "${{ !startsWith(github.event.head_commit.message, 'release: ') }}"

permissions:
  contents: read

jobs:
  go:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", stable]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Lint
        run: make lint

      - name: Tests with race
        run: make race

      - name: Coverage at 100%
        run: make cover

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck scripts/*.sh

  # The release tag of this commit, when it has one.
  tag:
    needs: [go, shellcheck]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Find the tag of this commit
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/v" --paginate --jq '.[] | select(.object.sha == "${{ github.sha }}") | .ref' | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: [tag]
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    permissions:
      contents: write
